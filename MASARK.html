<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masarak — مسارك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
:root{
  --bg:#050F20; --bg2:#09193A; --surface:#0B1E40; --surface2:#10295A;
  --line:rgba(150,185,230,.15); --ink:#EAF2FB; --muted:#8FA6C2;
  --blue:#2F7FE0; --blue-d:#1A4FA3; --teal:#14A5A8; --green:#19D69A;
  --road:#16345F; --tint:rgba(25,214,154,.13); --tint-blue:rgba(47,127,224,.15);
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  box-sizing:border-box; color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(86px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:8px}
.hidden{display:none!important}
.logo-img{display:block;max-width:100%;height:auto}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
.grad-text{background:linear-gradient(90deg,#4C9BFF,#14A5A8 60%,#19D69A);-webkit-background-clip:text;background-clip:text;color:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 26px;font-weight:600;transition:transform .15s,box-shadow .15s,background .15s}
.btn-primary{background:linear-gradient(100deg,#1A4FA3,#0F7F9C 70%,#0E9C98);color:#fff;box-shadow:0 8px 24px rgba(15,127,156,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(15,127,156,.42)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--tint-blue)}
.btn-sm{padding:8px 16px;font-size:14px;border-radius:10px}
a.btn{text-decoration:none}

/* top bar */
.bar{position:sticky;top:0;z-index:30;background:rgba(5,15,32,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand img{width:44px}
.brand b{font-size:26px;font-weight:700}
.nav{display:flex;gap:4px}
.tab{background:none;border:0;padding:8px 16px;border-radius:10px;font-weight:600;color:var(--muted)}
.tab:hover:not(:disabled){color:var(--ink);background:var(--tint-blue)}
.tab:disabled{opacity:.35;cursor:not-allowed}
.right{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--blue-d),var(--teal))}
.uname{font-size:14px;color:var(--muted)}

/* landing */
.hero{position:relative;padding:72px 0 56px;overflow:hidden;background:radial-gradient(70% 90% at 85% 0%,rgba(20,165,168,.2) 0,transparent 60%),radial-gradient(60% 80% at 0% 100%,rgba(26,79,163,.4) 0,transparent 65%),linear-gradient(180deg,var(--bg2),var(--bg))}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.22;margin:0 0 20px;font-weight:700;letter-spacing:-.01em}
.hero p{font-size:19px;color:var(--muted);max-width:31em;margin:0 0 32px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-art{border-radius:32px;padding:34px;background:linear-gradient(160deg,rgba(18,48,98,.7),rgba(8,24,52,.7));border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.steps{padding:56px 0 84px}
.steps h2{font-size:30px;margin:0 0 34px}
.step-row{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.step-item{position:relative}
.dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--blue-d),var(--teal));margin-bottom:14px;position:relative;z-index:1}
.step-item:nth-child(3) .dot{background:linear-gradient(135deg,var(--teal),#12B98A)}
.step-item::before{content:"";position:absolute;top:21px;height:2px;inset-inline-start:calc(-100% - 28px + 56px);width:calc(100% + 28px - 68px);background:repeating-linear-gradient(90deg,rgba(150,185,230,.35) 0 8px,transparent 8px 16px)}
.step-item:first-child::before{display:none}
.step-item h3{margin:0 0 6px;font-size:19px}
.step-item p{margin:0;color:var(--muted);font-size:15px}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:14px;text-align:center}

/* auth */
.auth{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:36px 0;background:radial-gradient(60% 60% at 50% 0%,rgba(26,79,163,.35) 0,transparent 70%)}
.auth-card{width:min(440px,100% - 32px);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:34px 32px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.auth-card .logo-img{width:190px;margin:0 auto 20px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px}
.seg button{border:0;background:none;padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink)}
label.f{display:block;font-size:14px;font-weight:600;margin:0 0 14px}
label.f span{display:block;margin-bottom:6px;color:var(--muted);font-weight:500}
.inp{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:12px 14px;outline:none;transition:border .15s}
.inp:focus{border-color:var(--teal)}
.note{font-size:13px;color:var(--muted);margin-top:14px;text-align:center}
.err{color:#FF8C7A;font-size:14px;margin:0 0 12px;min-height:20px}

/* app sections */
main.app{padding:40px 0 90px}
.sec{margin-bottom:64px}
.page-h{margin:0 0 6px;font-size:30px;font-weight:700}
.page-sub{margin:0 0 24px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:stretch}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:270px;border:2px dashed rgba(150,185,230,.3);border-radius:18px;background:linear-gradient(160deg,var(--surface),var(--bg2));padding:30px;cursor:pointer;transition:border .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--green);background:linear-gradient(160deg,#0D2A55,var(--bg2))}
.drop svg{color:var(--teal)}
.drop b{font-size:19px}
.drop small{color:var(--muted)}
.drop.busy{pointer-events:none;opacity:.8}
.filebar{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-top:14px}
.filebar .nm{display:flex;align-items:center;gap:10px;font-weight:600;word-break:break-all}
.filebar .nm svg{color:var(--green);flex:none}
.help h3{margin:0 0 12px;font-size:18px}
.help ul{margin:0 0 16px;padding-inline-start:20px;color:var(--muted);font-size:15px}
.help li{margin-bottom:8px}
.help .priv{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--tint);color:#5EE8B8;border-radius:999px;padding:4px 14px;font-size:14px;font-weight:600}
.chip.miss{background:var(--tint-blue);color:#8DBEFF}
.jobs{display:grid;gap:14px;margin-top:20px}
.job{display:grid;grid-template-columns:84px 1fr auto;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 22px}
.job.top{border-color:rgba(25,214,154,.5);box-shadow:0 0 0 3px rgba(25,214,154,.08)}
.job.sel{border-color:var(--blue)}
.ring{--p:0;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--road) 0)}
.ring i{font-style:normal;width:62px;height:62px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:18px}
.job h3{margin:0 0 2px;font-size:20px}
.job p{margin:0 0 8px;color:var(--muted);font-size:14px}
.tagbest{display:inline-block;background:var(--tint);color:#5EE8B8;font-size:12px;border-radius:8px;padding:1px 10px;margin-inline-start:8px;vertical-align:middle;font-weight:600}

/* this week */
.week-card{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:start;background:linear-gradient(120deg,#0E2A57,#0B3C5E 70%,#0C4B58);border:1px solid rgba(25,214,154,.25);border-radius:20px;padding:24px 28px;margin-bottom:26px}
.week-card .wn{min-width:120px}
.week-card .wn small{color:var(--muted);display:block;font-size:13px}
.week-card .wn b{font-size:22px;display:block;line-height:1.3}
.week-card .wn em{font-style:normal;color:#5EE8B8;font-size:14px}
.week-card .tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.week-card .done-msg{font-size:18px;font-weight:600;color:#5EE8B8}

/* roadmap */
.rm-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.overall{min-width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.overall .t{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
.bar-track{height:10px;border-radius:99px;background:var(--road);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#1F5FBF,#14A5A8,#19D69A);transition:width .5s}
.overall small{color:var(--muted)}
.overall a{color:#8DBEFF}
.rm{display:grid;grid-template-columns:1.2fr 1fr;gap:26px;align-items:start}
.road-box{position:relative;background:radial-gradient(70% 45% at 80% 0%,rgba(25,214,154,.1) 0,transparent 70%),radial-gradient(60% 40% at 15% 100%,rgba(47,127,224,.16) 0,transparent 70%),var(--surface);border:1px solid var(--line);border-radius:26px;padding:14px;overflow:hidden}
.road-stage{position:relative;width:100%;max-width:720px;margin:0 auto;aspect-ratio:700/900}
.road-stage svg{position:absolute;inset:0;width:100%;height:100%;direction:ltr}
.st{position:absolute;transform:translate(-50%,-50%);z-index:2}
.pin{position:relative;width:54px;height:54px;border-radius:50%;border:3px solid var(--bg);display:grid;place-items:center;font-weight:700;font-size:18px;background:#1B3A6B;color:#B7CAE3;box-shadow:0 0 0 2px rgba(150,185,230,.35),0 8px 18px rgba(0,0,0,.45);transition:transform .15s}
.pin:hover{transform:scale(1.08)}
.st.done .pin{background:linear-gradient(135deg,#14A5A8,#19D69A);color:#04261F;box-shadow:0 0 0 2px var(--green),0 8px 22px rgba(25,214,154,.35)}
.st.current .pin{background:linear-gradient(135deg,#1A4FA3,#2F7FE0);color:#fff;box-shadow:0 0 0 2px var(--blue),0 8px 22px rgba(47,127,224,.5)}
.st.current .pin::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--blue);opacity:.5;animation:pulse 2s ease-out infinite}
.st.sel .pin{outline:3px solid #fff;outline-offset:4px}
.st.goal .pin{width:64px;height:64px;background:linear-gradient(135deg,#1A4FA3,#19D69A);color:#fff;box-shadow:0 0 0 2px var(--green),0 8px 22px rgba(25,214,154,.4)}
@keyframes pulse{0%{transform:scale(.85);opacity:.6}100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){.st.current .pin::after{animation:none}.bar-fill{transition:none}html{scroll-behavior:auto}}
.lab{position:absolute;top:50%;transform:translateY(-50%);width:max-content;max-width:170px;line-height:1.35;pointer-events:none;background:rgba(5,15,32,.92);border:1px solid var(--line);border-radius:12px;padding:6px 12px;text-align:start}
.lab.r{left:calc(100% + 12px)}
.lab.l{right:calc(100% + 12px)}
.lab b{display:block;font-size:14.5px}
.lab small{color:var(--muted);font-size:12.5px}
.st.done .lab small{color:#5EE8B8}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:12px 14px 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px}
.detail{position:sticky;top:86px}
.detail h2{margin:0 0 4px;font-size:25px}
.detail .why{color:var(--muted);margin:0 0 16px;font-size:15px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pill{background:var(--tint-blue);color:#8DBEFF;border-radius:10px;padding:3px 12px;font-size:13px;font-weight:600}
.pill.g{background:var(--tint);color:#5EE8B8}
.detail h4{margin:20px 0 10px;font-size:16px}
.wk{margin-bottom:14px}
.wk>b{display:flex;align-items:center;gap:8px;font-size:14px;color:#8DBEFF;margin-bottom:8px}
.wk>b::after{content:"";flex:1;height:1px;background:var(--line)}
.wk.cur>b{color:#5EE8B8}
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--bg);transition:border .15s,background .15s}
.task:hover{border-color:var(--teal)}
.task input{appearance:none;flex:none;width:22px;height:22px;border-radius:7px;border:2px solid #5E7899;margin-top:3px;display:grid;place-items:center;cursor:pointer;background:transparent}
.task input:checked{background:linear-gradient(135deg,#14A5A8,#19D69A);border-color:transparent}
.task input:checked::after{content:"";width:6px;height:11px;border:solid #04261F;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task.on{background:var(--tint)}
.task.on span{color:var(--muted);text-decoration:line-through}
.res{margin:0;padding-inline-start:20px;color:var(--muted);font-size:15px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#EAF2FB;color:#06223a;padding:12px 22px;border-radius:12px;font-weight:600;box-shadow:0 10px 40px rgba(0,0,0,.5);z-index:50;max-width:calc(100% - 32px)}

@media (max-width:900px){
  .hero .wrap,.two,.rm{grid-template-columns:1fr}
  .hero{padding-top:34px}
  .hero-art{order:-1;max-width:420px;margin-inline:auto}
  .detail{position:static}
  .step-row{grid-template-columns:1fr;gap:26px}
  .step-item::before{display:none}
  .job{grid-template-columns:70px 1fr}
  .job .btn{grid-column:1/-1}
  .week-card{grid-template-columns:1fr}
  .nav{display:none}
  .uname{display:none}
  .pin{width:42px;height:42px;font-size:15px}
  .st.goal .pin{width:50px;height:50px}
  .lab{max-width:118px;padding:4px 9px}.lab b{font-size:12.5px}.lab small{font-size:11px}
}
/* ---- v3 additions ---- */
.demo{background:var(--tint-blue);border:1px solid rgba(47,127,224,.4);border-radius:12px;padding:10px 16px;font-size:14px;color:#BBD7FF;margin-bottom:20px}
.form-card{display:grid;gap:18px;align-content:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-card label.f{margin:0}
.hint{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir=rtl] select.inp{background-position:18px 50%,13px 50%}
.drop.small{min-height:130px;padding:18px;gap:6px}
.drop.small svg{width:36px;height:36px}
.drop.has{border-color:rgba(25,214,154,.55)}
.nocv{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.nocv p{margin:0;font-size:14px;color:var(--muted)}
.nocv .btn{padding:8px 16px;font-size:14px;border-radius:10px;border-color:rgba(25,214,154,.45);color:#5EE8B8}
.nocv .btn:hover{background:var(--tint)}
.nocv .btn svg{flex:none}
[dir=rtl] .nocv .btn svg{transform:scaleX(-1)}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.stg{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center}
.stg i{width:10px;height:10px;border-radius:50%;background:#2A4468;flex:none}
.stg.on{color:var(--ink);border-color:var(--blue)}
.stg.on i{background:var(--blue);box-shadow:0 0 0 4px rgba(47,127,224,.25)}
.stg.ok{color:#5EE8B8}.stg.ok i{background:var(--green)}
.jobs3{display:grid;gap:16px;margin-top:6px}
.jc{display:grid;grid-template-columns:100px 1fr;gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}
.jc.r1{border-color:rgba(25,214,154,.5);box-shadow:0 0 0 3px rgba(25,214,154,.08)}
.jc .ring{width:92px;height:92px}.jc .ring i{width:74px;height:74px;font-size:22px}
.jc .rk{display:block;text-align:center;font-size:13px;color:var(--muted);margin-top:8px}
.jc h3{margin:0;font-size:22px}
.jc .co{color:var(--muted);margin:2px 0 10px;font-size:15px}
.jc .sum{margin:0 0 14px;color:#C9D8EA;font-size:15px}
.jc h5{margin:14px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.jc .top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.chip.nice{opacity:.75}
.gapc{margin-top:18px}
.gapc p{margin:0 0 14px;color:#C9D8EA}
.sw{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px}
.sw input{appearance:none;width:42px;height:24px;border-radius:99px;background:#2A4468;position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.sw input:checked{background:linear-gradient(90deg,#14A5A8,#19D69A)}
.sw input:checked::after{inset-inline-start:21px}
.sw small{color:var(--muted);display:block;font-size:12px;line-height:1.4}
.st.late .pin{background:linear-gradient(135deg,#C98A1B,#F0B34A);color:#2B1B00;box-shadow:0 0 0 2px #F0B34A,0 8px 22px rgba(240,179,74,.35)}
.late-note{display:flex;gap:10px;align-items:center;background:rgba(240,179,74,.12);border:1px solid rgba(240,179,74,.45);color:#F6CF86;border-radius:12px;padding:10px 14px;font-size:14px;margin-top:14px}
.late-note a{color:#FFE2A8;text-decoration:underline;cursor:pointer}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.filters select{flex:1;min-width:130px;padding:8px 12px;font-size:14px}
.task .tb{flex:1;min-width:0}
.task .tt{display:block;font-weight:600;cursor:pointer;line-height:1.5}
.task .td{margin:2px 0 6px;color:var(--muted);font-size:14px}
.task .tm{display:inline-block;font-size:12.5px;color:#8DBEFF;background:var(--tint-blue);border-radius:8px;padding:0 9px;margin-bottom:6px}
.task.on .tt{color:var(--muted);text-decoration:line-through}
.rl{display:flex;flex-wrap:wrap;gap:8px}
.rlink{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:4px 10px 4px 6px;font-size:13px;color:#9CC6FF;text-decoration:none}
.rlink:hover{border-color:var(--teal)}
.rlink b{background:var(--blue-d);color:#fff;border-radius:6px;padding:0 7px;font-size:12px}
.rlink em{font-style:normal;color:var(--muted);font-size:11.5px}
.week-card .task{margin:0}
.week-card .tasks{align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.stages{grid-template-columns:1fr 1fr}.jc{grid-template-columns:1fr}.jc .ringcol{display:flex;align-items:center;gap:14px}.jc .rk{margin:0}}

/* ---- v4: pages, 10-job list, interview ---- */
.nav .tab[aria-current]{color:var(--ink);background:var(--tint-blue)}
.jlist{display:grid;gap:12px;margin:0 0 22px}
.jx{background:var(--surface);border:1px solid var(--line);border-radius:18px;transition:border .15s}
.jx:hover{border-color:rgba(20,165,168,.55)}
.jx[open]{border-color:rgba(47,127,224,.55)}
.jx.r1{border-color:rgba(25,214,154,.5);box-shadow:0 0 0 3px rgba(25,214,154,.08)}
.jx summary{list-style:none;display:grid;grid-template-columns:84px 1fr auto;gap:18px;align-items:center;padding:16px 20px;cursor:pointer}
.jx summary::-webkit-details-marker{display:none}
.jx .ringcol{text-align:center}
.jx .ring{width:68px;height:68px;margin-inline:auto}.jx .ring i{width:53px;height:53px;font-size:16px}
.jx .rk{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.jm h3{margin:0;font-size:19px;line-height:1.4}
.jm .co{margin:0;color:#C9D8EA;font-size:15px}
.jm .addr{margin:3px 0 0;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.jm .addr svg{flex:none;color:var(--teal)}
.jm .when{color:#8DBEFF;font-weight:600}
.jm .sep{opacity:.5}
.ja{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chev{width:10px;height:10px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin:0 6px;transition:transform .2s;flex:none}
.jx[open] .chev{transform:rotate(-135deg)}
.jbody{margin:0 20px;padding:14px 0 18px;border-top:1px solid var(--line)}
.jbody h5{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.jbody p{margin:0;color:#C9D8EA;font-size:15px}
.pgcards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.pgc{display:flex;align-items:center;gap:16px;text-align:start;background:linear-gradient(120deg,#0E2A57,#0B3C5E 70%,#0C4B58);border:1px solid rgba(25,214,154,.25);border-radius:18px;padding:20px 22px;transition:transform .15s,border .15s}
.pgc:hover{transform:translateY(-2px);border-color:var(--green)}
.pgc i{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--blue-d),var(--teal))}
.pgc strong{display:block;font-size:19px}
.pgc small{display:block;color:var(--muted);font-size:14px;line-height:1.5}
.empty{text-align:center;padding:52px 24px}
.empty h2{margin:0 0 6px}.empty p{color:var(--muted);margin:0 0 20px}
.iq{max-width:760px;margin-inline:auto}
textarea{font:inherit;color:inherit}
.iq-top{display:flex;justify-content:space-between;align-items:center}
.tmr{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;color:#5EE8B8}
.tmr.late{color:#F0B34A}
.iq-q{font-size:24px;line-height:1.5;margin:0 0 16px}
textarea.inp{resize:vertical;min-height:140px;margin-bottom:12px;line-height:1.7}
.iq-tip{background:var(--tint-blue);border:1px solid rgba(47,127,224,.4);color:#BBD7FF;border-radius:12px;padding:10px 14px;margin:12px 0 0;font-size:15px}
.iq-rh{margin:20px 0 10px;font-size:16px}
.rates{display:flex;gap:8px;flex-wrap:wrap}
.rate{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 18px;font-weight:600;color:var(--muted)}
.rate.on.r1{border-color:#F0B34A;color:#F6CF86;background:rgba(240,179,74,.12)}
.rate.on.r2{border-color:var(--blue);color:#BBD7FF;background:var(--tint-blue)}
.rate.on.r3{border-color:var(--green);color:#5EE8B8;background:var(--tint)}
.iq-foot{margin-top:22px;display:flex;justify-content:flex-end}
.rv{border-top:1px solid var(--line);padding:12px 0}
.rv summary{display:flex;gap:12px;align-items:center;cursor:pointer;font-weight:600;list-style:none}
.rv summary::-webkit-details-marker{display:none}
.rv p{margin:10px 0 0;color:#C9D8EA;white-space:pre-wrap}
@media (max-width:900px){
  html{scroll-padding-top:calc(150px + env(safe-area-inset-top,0px))}
  .nav{display:flex;order:3;width:100%;overflow-x:auto;justify-content:center}
  .bar .wrap{flex-wrap:wrap}
  .jx summary{grid-template-columns:64px 1fr;padding:14px 16px}
  .ja{grid-column:1/-1;justify-content:flex-start}
  .pgcards{grid-template-columns:1fr}
}
</style>
</head>

function buildDemo(cvIds,title,loc,hours){
  const key=ARCH_KEYS.find(([re])=>re.test(title))[1],R=ARCH[key];
  const PRE=['','Junior ','Associate ','Senior ','','Junior ','Lead ','','Associate ',''],SUF=['',' (Remote)','',' (Hybrid)',' - Contract','',' (Remote)',' - Internship','',' II'];
  const SEN=['junior','junior','mid','senior','mid','junior','senior','intern','mid','mid'],YRS=[0,1,2,5,3,1,6,0,2,3],AGE=[0,1,1,2,3,3,5,7,9,14];
  const li='https://www.linkedin.com/jobs/search/?keywords='+enc(title)+'&location='+enc(loc);
  let jobs=Array.from({length:10},(_,i)=>{
    const k=i%R.length,rot=R.slice(k).concat(R.slice(0,k)),nm=3+(i%2),must=rot.slice(0,nm),nice=rot.slice(nm,nm+2);
    const all=must.map(id=>({id,w:1,imp:'must'})).concat(nice.map(id=>({id,w:.4,imp:'nice'})));
    const tot=all.reduce((a,x)=>a+x.w,0),mt=all.filter(x=>cvIds.includes(x.id));
    return {title:PRE[i]+title+SUF[i],company:'Sample Company '+'ABCDEFGHIJ'[i],location:loc,score:Math.round(mt.reduce((a,x)=>a+x.w,0)/tot*100),apply_url:li+'&currentJobId=demo'+(i+1),summary:'',posted:isoOf(addDays(today0(),-AGE[i])),

  }).sort((a,b)=>b.score-a.score).map((j,i)=>Object.assign(j,{rank:i+1}));
  const g={};jobs.slice(0,3).forEach(j=>j.missing.forEach(m=>{const o=g[m.sid]||(g[m.sid]={sid:m.sid,name:m.name,demanded_by:0,importance:'nice'});o.demanded_by++;if(m.importance==='must')o.importance='must';}));
  const gap=Object.values(g).sort((a,b)=>b.demanded_by-a.demanded_by||(a.importance==='must'?-1:1)-(b.importance==='must'?-1:1));
  const h=Math.max(2,hours),queue=[];
  gap.forEach(x=>SK[x.sid].t.en.forEach((_,i)=>queue.push({sid:x.sid,idx:i,hrs:i%2===0?3:2})));
  const wk=[];let cur=[],sum=0;
  queue.forEach(q=>{if(cur.length&&(sum+q.hrs>h||cur.length>=4)){wk.push(cur);cur=[];sum=0;}cur.push(q);sum+=q.hrs;});
  if(cur.length)wk.push(cur);
  const start=nextMonday();let c=0;
  const weeks=wk.slice(0,12).map((items,k)=>{
    const sk=[...new Set(items.map(q=>SK[q.sid].en))];
    return {week:k+1,week_start:isoOf(addDays(start,7*k)),week_end:isoOf(addDays(start,7*k+6)),focus:sk.slice(0,2).join(' + '),

  });
  return {demo:true,cv_skills:cvIds.map(id=>SK[id].en),jobs,gap:{summary:'',skills:gap},
    roadmap:{roadmap_id:'demo',start_date:isoOf(start),total_weeks:weeks.length,hours:h,reminders_enabled:true,weeks}};
}

async function http(path,o={}){
  const h={};if(S.token)h.Authorization='Bearer '+S.token;
  let b;if(o.form)b=o.form;else if(o.body){h['Content-Type']='application/json';b=JSON.stringify(o.body);}
  const r=await fetch(CFG.API_BASE+path,{method:o.method||'GET',headers:h,body:b});
  if(!r.ok)throw new Error('http '+r.status);return r.json();
}
async function authCall(mode,name,email,pass){
  const demoAuth=()=>({token:'demo',user:{name:name||email.split('@')[0],email}});
  if(DEMO){S.demo=true;return demoAuth();}
  try{
    return await http('/auth/'+(mode==='up'?'register':'login'),{method:'POST',body:mode==='up'?{name,email,password:pass}:{email,password:pass}});
  }catch(e){
    const m=/^http (\d+)/.exec(e&&e.message||''),code=m?+m[1]:0;
    if(!m||code===404||code>=500){DEMO=true;S.demo=true;return demoAuth();}
    throw e;
  }
}

async function pdfText(file){
  if(!window.pdfjsLib)throw new Error('lib');
  try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}catch(e){}
  try{
    const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer(),isEvalSupported:false,useWorkerFetch:false}).promise;
    let out='';const n=Math.min(doc.numPages,12);
    for(let p=1;p<=n;p++){const pg=await doc.getPage(p);const tc=await pg.getTextContent();out+=tc.items.map(i=>i.str).join(' ')+'\n';}
    return out;
  }catch(e){throw new Error('pdf');}
}
const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\u064B-\u065F\u0640]/g,'');
function detect(text){
  const x=norm(text),rev=[...x].reverse().join('');
  return Object.keys(SK).filter(id=>SK[id].al.some(a=>{
    const al=norm(a);
    if(/[\u0600-\u06FF]/.test(al))return x.includes(al)||rev.includes(al)||x.includes([...al].reverse().join(''));
    const e=al.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');
    return new RegExp('(^|[^a-z0-9+#])'+e+'($|[^a-z0-9+#])').test(x);
  }));
}

async function runJobMatch(file,title,loc,hours){

function normalizeJM(d,loc,hours){

    info:{},matched:[],missing:[]

  if(!jobs.length)throw new Error('failed');
  const sk=(Array.isArray(d.roadmap)?d.roadmap:[]).filter(s=>s&&s.skill).map((s,i)=>Object.assign({},s,{_w:+s.week||i+1})).sort((a,b)=>a._w-b._w);
  const per=Math.max(1,Math.ceil(sk.length/12)),start=nextMonday(),weeks=[];let c=0;
  for(let i=0;i<sk.length;i+=per){

    cv_skills:(Array.isArray(d.cv_skills)?d.cv_skills:[]).map(x=>typeof x==='string'?x:(x&&(x.name||x.skill))||'').filter(Boolean),
    jobs,gap:{summary:'',skills:sk.slice(0,12).map(s=>({name:s.skill}))},

function layoutRoad(M){

      :s.goal?'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>'
      :full?'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':i;
    el.innerHTML=`<button class="pin" aria-label="${esc(title)}">${ic}</button>${showLab?`<div class="lab ${p.x>350?'l':'r'}"><b>${esc(title)}</b><small>${esc(sub)}</small></div>`:''}`;

  if(d<0)target=1;else{const f=infos[d].done/infos[d].total;target=tpos(d)+(tpos(d+1)-tpos(d))*f;}

  if(i===n+1){
    box.innerHTML=`<h2>${t('goalname')}</h2><p class="why">${t('goal_p')}</p>
    ${r.jobs.slice(0,3).map(j=>`<div class="task" style="cursor:default"><div class="tb"><span class="tt" style="cursor:default">${esc(j.title)}</span><span class="tm">${esc(j.company)} · ${+j.score||0}%</span><div class="rl"><a class="rlink" href="${esc(safeUrl(j.apply_url))}" target="_blank" rel="noopener noreferrer"><b>LinkedIn</b>${t('apply')}</a></div></div></div>`).join('')}`;return;}
  const w=weeks[i-1],inf=infos[i-1],p=inf.total?Math.round(inf.done/inf.total*100):0;
  const skills=[...new Set(weeks.flatMap(x=>x.tasks.map(k=>k.skill)))];
  const f=S.filt;if(f.skill&&!skills.includes(f.skill))f.skill='';
  const tasks=w.tasks.filter(x=>(!f.skill||x.skill===f.skill)&&(f.status==='all'||(f.status==='done')===(x.status==='done')));
  box.innerHTML=`<h2>${t('week')} ${i}: ${esc(w.focus)}</h2><p class="why">${range(w.week_start,w.week_end)}${i<tl.cur&&!inf.full?' · '+t('lg4'):''}</p>
  <div class="meta"><span class="pill">${t('dur')}${inf.hrs}/${r.roadmap.hours}</span><span class="pill ${inf.full?'g':''}">${inf.full?t('complete'):t('done_pct',p)}</span></div>
  <div class="bar-track" style="height:8px"><div class="bar-fill" style="width:${p}%"></div></div>
  <div class="filters"><select class="inp" id="fSkill" aria-label="${t('f_skill')}"><option value="">${t('f_all')}</option>${skills.map(s=>`<option ${f.skill===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
    <select class="inp" id="fStatus" aria-label="${t('f_status')}">${[['all','s_all'],['todo','s_todo'],['done','s_done']].map(([v,k])=>`<option value="${v}" ${f.status===v?'selected':''}>${t(k)}</option>`).join('')}</select></div>
  <div>${tasks.length?tasks.map(x=>taskHTML(x,'dt',false)).join(''):`<p class="why">${t('no_tasks')}</p>`}</div>`;
  $('#fSkill').onchange=e=>{S.filt.skill=e.target.value;save();renderDetail();bindChecks(box);};
  $('#fStatus').onchange=e=>{S.filt.status=e.target.value;save();renderDetail();bindChecks(box);};
}
function bindChecks(root){root.querySelectorAll('input[data-id]').forEach(c=>c.onchange=()=>toggleTask(c.dataset.id,c.checked));}
async function toggleTask(id,checked){
  const rm=S.result.roadmap,before=rm.weeks.map(w=>wkInfo(w).full);
  let task=null,wi=-1;rm.weeks.forEach((w,k)=>w.tasks.forEach(x=>{if(String(x.task_id)===String(id)){task=x;wi=k;}}));
  if(!task)return;
  const prev=task.status;task.status=checked?'done':'todo';
  const after=rm.weeks.map(w=>wkInfo(w).full),idx=after.findIndex((f,k)=>f&&!before[k]);
  if(idx>=0){toast(t('toast_wk',idx+1));const nx=after.findIndex(f=>!f);S.sel=nx<0?rm.weeks.length+1:nx+1;}else S.sel=wi+1;
  save();renderMap(true);
  if(!DEMO&&!S.result.local){try{await http('/task/update',{method:'POST',body:{task_id:id,status:task.status}});}catch(e){task.status=prev;save();renderMap(true);toast(t('er_sync'));}}
}

/* ===================== pages ===================== */
const PAGES=['search','roadmap','interview'];let page='search';
const emptyState=()=>`<div class="card empty"><h2>${t('empty_h')}</h2><p>${t('empty_p')}</p><button class="btn btn-primary" data-page="search">${t('empty_go')}</button></div>`;
function openInterview(){
  try{
    const u=new URL(CFG.INTERVIEW_URL,location.href),j=S.result&&S.result.jobs&&S.result.jobs[0];
    u.searchParams.set('lang',L());
    if(j){u.searchParams.set('job_title',j.title||'');u.searchParams.set('company',j.company||'');}
    window.open(u.href,'_blank','noopener');
  }catch(e){toast(t('er_net'));}
}
function showPage(p,fromHash){
  if(p==='interview'&&CFG.INTERVIEW_URL)p='search';
  if(!PAGES.includes(p))p='search';
  page=p;
  PAGES.forEach(x=>$('#pg-'+x).classList.toggle('hidden',x!==p));
  document.querySelectorAll('.nav .tab').forEach(b=>b.toggleAttribute('aria-current',b.dataset.page===p));
  if(!fromHash){try{if(location.hash!=='#'+p)history.pushState(null,'','#'+p);}catch(e){}}
  stopTimer();
  if(p==='roadmap')renderRoadmapPage();else if(p==='interview')renderInterviewPage();
  window.scrollTo(0,0);
}
window.addEventListener('popstate',()=>{if(!$('#v-app').classList.contains('hidden'))showPage((location.hash||'#search').slice(1),true);});
function renderRoadmapPage(){
  const el=$('#sec-map');
  if(!S.result||!S.result.roadmap.weeks.length){el.innerHTML=emptyState();return;}
  renderMap(false);
}

/* ---------- interview simulation ---------- */
let INT=null,tmrH=null;const Q_SEC=120;
const stopTimer=()=>{clearInterval(tmrH);tmrH=null;};
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function buildQs(j){
  const m=(j.matched||[])[0],miss=(j.missing||[]).find(x=>x.importance==='must')||(j.missing||[])[0];
  return [
    {q:t('gq1',j.title,j.company),tip:t('gt1')},
    {q:m?t('gq2',m):t('gq2b'),tip:t('gt2')},
    {q:miss?t('gq3',miss.name):t('gq3b'),tip:t('gt3')},
    {q:t('gq4'),tip:t('gt4')},
    {q:t('gq5'),tip:t('gt5')}
  ];
}
function renderInterviewPage(){
  const el=$('#sec-int');stopTimer();
  if(!S.result){el.innerHTML=emptyState();return;}
  if(INT&&INT.lang!==L())INT=null;
  const jobs=S.result.jobs;
  if(!INT||INT.phase==='pick'){
    const ji=INT?INT.ji:0;
    el.innerHTML=`<h1 class="page-h">${t('int_h')}</h1><p class="page-sub">${t('int_sub')}</p>
    <div class="card form-card" style="max-width:640px"><label class="f"><span>${t('int_pick')}</span><select id="intJob" class="inp">${jobs.map((j,i)=>`<option value="${i}" ${i===ji?'selected':''}>${esc(j.title)} · ${esc(j.company)} (${+j.score||0}%)</option>`).join('')}</select></label>
    <button class="btn btn-primary" id="intGo">${t('int_start')}</button><p class="note" style="text-align:start;margin:0">${t('int_note')}</p></div>`;
    $('#intGo').onclick=()=>{const k=+$('#intJob').value;INT={phase:'run',lang:L(),ji:k,qs:buildQs(jobs[k]),qi:0,ans:[],rate:[],sec:Q_SEC};renderInterviewPage();};
    return;
  }
  const j=jobs[INT.ji],n=INT.qs.length;
  if(INT.phase==='run'){
    const q=INT.qs[INT.qi];
    el.innerHTML=`<h1 class="page-h">${t('int_h')}</h1><p class="page-sub">${esc(j.title)} · ${esc(j.company)}</p>
    <div class="card iq"><div class="iq-top"><span class="pill">${t('q_n',INT.qi+1,n)}</span><span class="tmr" id="tmr">${mmss(INT.sec)}</span></div>
    <div class="bar-track" style="height:6px;margin:12px 0 20px"><div class="bar-fill" style="width:${INT.qi/n*100}%"></div></div>
    <h2 class="iq-q">${esc(q.q)}</h2>
    <textarea id="intAns" class="inp" rows="6" placeholder="${t('int_ans_ph')}">${esc(INT.ans[INT.qi]||'')}</textarea>
    <button class="btn btn-ghost btn-sm" id="tipBtn" type="button">${t('int_tip_show')}</button><p class="iq-tip hidden" id="tipTxt">${esc(q.tip)}</p>
    <h4 class="iq-rh">${t('int_rate_h')}</h4><div class="rates">${[1,2,3].map(v=>`<button type="button" class="rate r${v} ${INT.rate[INT.qi]===v?'on':''}" data-v="${v}">${t('r'+v)}</button>`).join('')}</div>
    <div class="iq-foot"><button class="btn btn-primary" id="intNext">${INT.qi===n-1?t('int_end'):t('int_next')}</button></div></div>`;
    $('#intAns').oninput=e=>{INT.ans[INT.qi]=e.target.value;};
    $('#tipBtn').onclick=()=>{const tp=$('#tipTxt'),h=tp.classList.toggle('hidden');$('#tipBtn').textContent=t(h?'int_tip_show':'int_tip_hide');};
    el.querySelectorAll('.rate').forEach(b=>b.onclick=()=>{INT.rate[INT.qi]=+b.dataset.v;el.querySelectorAll('.rate').forEach(x=>x.classList.toggle('on',x===b));});
    $('#intNext').onclick=()=>{if(INT.qi<n-1){INT.qi++;INT.sec=Q_SEC;}else INT.phase='done';renderInterviewPage();};
    tmrH=setInterval(()=>{const e=$('#tmr');if(!e||page!=='interview'){stopTimer();return;}INT.sec=Math.max(0,INT.sec-1);e.textContent=mmss(INT.sec);if(INT.sec===0){e.classList.add('late');e.title=t('int_time_up');stopTimer();}},1000);
    return;
  }
  const strong=INT.rate.filter(v=>v===3).length,focus=(j.missing||[]).map(m=>m.name).slice(0,3);
  el.innerHTML=`<h1 class="page-h">${t('int_done_h')}</h1><p class="page-sub">${t('int_done_sub',strong,n)}</p>
  <div class="card"><h3 style="margin:0 0 12px;font-size:18px">${t('int_review')}</h3>
  ${INT.qs.map((q,i)=>`<details class="rv"><summary><span class="pill ${INT.rate[i]===3?'g':''}">${INT.rate[i]?t('r'+INT.rate[i]):'—'}</span><span>${esc(q.q)}</span></summary><p>${esc(INT.ans[i]||'')||t('int_none')}</p></details>`).join('')}
  ${focus.length?`<p class="why" style="margin:16px 0 8px;color:var(--muted)">${t('int_focus')}</p><div class="chips">${focus.map(f=>`<span class="chip miss">${esc(f)}</span>`).join('')}</div>`:''}
  <div class="cta" style="margin-top:22px"><button class="btn btn-primary" id="intAgain">${t('int_again')}</button><button class="btn btn-ghost" id="intOther">${t('int_other')}</button><button class="btn btn-ghost" data-page="roadmap">${t('pg_map_h')}</button></div></div>`;
  $('#intAgain').onclick=()=>{INT={phase:'run',lang:L(),ji:INT.ji,qs:buildQs(j),qi:0,ans:[],rate:[],sec:Q_SEC};renderInterviewPage();};
  $('#intOther').onclick=()=>{INT={phase:'pick',lang:L(),ji:INT.ji};renderInterviewPage();};
}

/* ===================== start ===================== */
applyLang();
if(S.user)enterApp();else show('landing');

</script>
</body>
